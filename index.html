<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مُكوِّن الشنطة — Bag Configurator</title>
<meta name="description" content="مكوّن شنطة ثلاثي الأبعاد: غيّر لون وخامة كل قطعة، وفكّك الشنطة لتشوف مكوّناتها.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1013;
    --panel:rgba(22,25,30,.82);
    --panel-line:rgba(255,255,255,.10);
    --ink:#eef1f5;
    --ink-dim:#9aa3ad;
    --gold:#d4a24c;
    --radius:14px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Cairo',system-ui,'Segoe UI',sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  canvas{display:block; touch-action:none}

  /* ---------- loading ---------- */
  #boot{
    position:fixed; inset:0; z-index:50; display:grid; place-content:center; gap:18px;
    justify-items:center; background:var(--bg); transition:opacity .6s ease;
  }
  #boot.gone{opacity:0; pointer-events:none}
  .ring{
    width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(255,255,255,.12); border-top-color:var(--gold);
    animation:spin 900ms linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot p{margin:0;color:var(--ink-dim);font-size:14px;letter-spacing:.2px}
  #boot .err{color:#ff9a8b;max-width:min(90vw,420px);text-align:center;line-height:1.9;font-size:13px}

  /* ---------- brand ---------- */
  #brand{
    position:fixed; top:20px; inset-inline-start:24px; z-index:10; pointer-events:none;
  }
  #brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.4px}
  #brand span{display:block;margin-top:2px;font-size:11px;color:var(--ink-dim);letter-spacing:.6px}

  /* ---------- panel ---------- */
  #ui{
    position:fixed; top:0; inset-inline-end:0; height:100%; z-index:20;
    width:min(340px,86vw); padding:20px 18px 24px;
    display:flex; flex-direction:column; gap:16px; overflow-y:auto;
    background:var(--panel); backdrop-filter:blur(18px);
    border-inline-start:1px solid var(--panel-line);
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;
  }
  #ui::-webkit-scrollbar{width:6px}
  #ui::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}

  .block{display:flex;flex-direction:column;gap:9px}
  .label{
    font-size:11px;color:var(--ink-dim);letter-spacing:.8px;
    text-transform:uppercase;font-weight:600;
  }

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-dim);
    background:rgba(255,255,255,.05); border:1px solid transparent;
    padding:7px 11px; border-radius:9px; cursor:pointer;
    transition:background .18s, color .18s, border-color .18s;
  }
  .chip:hover{background:rgba(255,255,255,.10); color:var(--ink)}
  .chip[aria-pressed="true"]{
    background:rgba(212,162,76,.16); color:var(--gold);
    border-color:rgba(212,162,76,.45);
  }

  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .sw{
    aspect-ratio:1; border-radius:50%; cursor:pointer; border:2px solid transparent;
    background-clip:padding-box; position:relative; transition:transform .16s;
    box-shadow:inset 0 -3px 8px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  }
  .sw:hover{transform:scale(1.12)}
  .sw[aria-pressed="true"]{border-color:var(--gold)}
  .sw[aria-pressed="true"]::after{
    content:''; position:absolute; inset:-5px; border-radius:50%;
    border:1px solid rgba(212,162,76,.4);
  }

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:2px;
    background:rgba(255,255,255,.16); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:15px;height:15px;border-radius:50%;
    background:var(--gold); cursor:pointer; border:none;
    box-shadow:0 0 0 4px rgba(212,162,76,.18);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--gold);
    cursor:pointer;border:none;box-shadow:0 0 0 4px rgba(212,162,76,.18);
  }

  .btn{
    font:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.06); border:1px solid var(--panel-line);
    padding:10px 12px; border-radius:10px; cursor:pointer; flex:1;
    transition:background .18s,border-color .18s;
  }
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn.on{background:rgba(212,162,76,.16);color:var(--gold);border-color:rgba(212,162,76,.45)}
  .btns{display:flex;gap:8px}

  .price{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:12px 14px;border-radius:var(--radius);
    background:rgba(212,162,76,.07);border:1px solid rgba(212,162,76,.20);
  }
  .price b{font-size:21px;color:var(--gold);font-weight:700}
  .price span{font-size:11px;color:var(--ink-dim);letter-spacing:.6px}

  hr{border:none;border-top:1px solid var(--panel-line);margin:2px 0}

  /* ---------- exploded labels ---------- */
  #labels{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden}
  .lab{
    position:absolute; transform:translate(-50%,-50%);
    font-size:12px; font-weight:700; letter-spacing:.3px; white-space:nowrap;
    padding:6px 11px; border-radius:8px; opacity:0;
    background:#0b0d10; border:1px solid rgba(212,162,76,.55);
    color:var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.6);
    transition:opacity .3s ease;
  }
  .lab.show{opacity:1}

  #hint{
    position:fixed; bottom:18px; inset-inline-start:24px; z-index:10;
    font-size:11.5px; color:var(--ink-dim); letter-spacing:.3px; pointer-events:none;
    transition:opacity .5s ease;
  }

  @media (max-width:720px){
    #ui{
      top:auto; bottom:0; height:auto; max-height:52vh; width:100%;
      border-inline-start:none; border-top:1px solid var(--panel-line);
      border-radius:18px 18px 0 0;
    }
    #hint{display:none}
    #brand{inset-inline-start:16px; top:14px}
  }
</style>
</head>
<body>

<div id="boot"><div class="ring"></div><p>بنجهّز الشنطة…</p></div>

<div id="brand">
  <h1>مُكوِّن الشنطة</h1>
  <span>3D BAG CONFIGURATOR</span>
</div>

<div id="labels"></div>
<div id="hint">اسحب للف · عجلة الماوس للتقريب</div>

<aside id="ui" hidden>

  <div class="block">
    <div class="label">القطعة</div>
    <div class="chips" id="parts"></div>
  </div>

  <hr>

  <div class="block">
    <div class="label" id="colorLabel">اللون</div>
    <div class="swatches" id="colors"></div>
  </div>

  <div class="block">
    <div class="label">الخامة</div>
    <div class="chips" id="finishes"></div>
  </div>

  <hr>

  <div class="block">
    <div class="row">
      <div class="label" style="margin:0">التفكيك</div>
      <span id="explodeVal" style="font-size:11px;color:var(--ink-dim)">0%</span>
    </div>
    <input type="range" id="explode" min="0" max="100" value="0">
  </div>

  <div class="btns">
    <button class="btn" id="spin">إيقاف اللف</button>
    <button class="btn" id="shot">📸 صورة</button>
  </div>

  <hr>

  <div class="block">
    <div class="label">تصميمات جاهزة</div>
    <div class="chips" id="presets"></div>
  </div>

  <div class="price">
    <span>السعر التقديري</span>
    <b id="price">—</b>
  </div>

</aside>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ===========================================================================
   0. القياسات — كل الأرقام بالسنتيمتر، مقاسة من صورة الشنطة الأصلية.
   شنطة ميني بمقبض علوي: الجسم شبه منحرف، أعرض من تحت، بجوانب مائلة.
   =========================================================================== */
const B = {
  wBot: 20.0,   // العرض من تحت
  wTop: 17.2,   // العرض من فوق
  h:    13.4,   // ارتفاع الجسم
  d:     7.0,   // العمق
  bevel: 0.55,  // نعومة الحواف — الجلد مش حاد
};
/* ميل الجانب: كام سنتيمتر بيضيق العرض لكل سنتيمتر لفوق */
const SLANT = (B.wBot - B.wTop) / 2 / B.h;
/** نصف عرض الجسم عند ارتفاع معيّن */
const halfAt = (y) => B.wBot / 2 - SLANT * y;

const FLAP_DROP  = 6.5;   // الفلاب بينزل قد إيه على الوش
const FLAP_OVER  = 0.35;  // بيزيد عن الجسم من الجنب
const FOLD_R     = 1.25;  // نصف قطر الطية اللي فوق

/* ===========================================================================
   1. المسرح — كاميرا عدسة طويلة زي تصوير المنتجات، وإضاءة استوديو.
   =========================================================================== */
const boot = document.getElementById('boot');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* خلفية استوديو: تدرّج رأسي هادي — بيخلي الذهب يلمع من غير ما يشتت */
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d').createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#252a30'); g.addColorStop(.55,'#14171b'); g.addColorStop(1,'#0b0d0f');
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 400);
camera.position.set(13.5, 16.5, 54);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 30;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minPolarAngle = Math.PI * 0.10;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;

/* الإضاءة: بيئة أوضة استوديو (جوّه three.js نفسها — مفيش أي ملف بيتحمّل)
   + كي لايت بظل ناعم عشان الشنطة تبقى قاعدة على الأرض مش طايرة. */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
  scene.environmentIntensity = 0.72;
}
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(11, 22, 15);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 8; key.shadow.camera.far = 70;
key.shadow.camera.left = -22; key.shadow.camera.right = 22;
key.shadow.camera.top = 26;  key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0012;
key.shadow.radius = 3;
scene.add(key);

const rim = new THREE.DirectionalLight(0xbcd2ff, 0.45);
rim.position.set(-14, 9, -13);
scene.add(rim);

/* الأرضية: قرص بتدرّج شعاعي + طبقة بتستقبل الظل بس */
{
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256,256,10, 256,256,256);
  g.addColorStop(0,'#2c3138'); g.addColorStop(.55,'#181b1f'); g.addColorStop(1,'#0b0d0f');
  ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(70, 64),
    new THREE.MeshStandardMaterial({ map:tex, roughness:.82, metalness:0 })
  );
  disc.rotation.x = -Math.PI/2;
  disc.position.y = -0.02;
  scene.add(disc);

  const catcher = new THREE.Mesh(
    new THREE.PlaneGeometry(120,120),
    new THREE.ShadowMaterial({ opacity:.42 })
  );
  catcher.rotation.x = -Math.PI/2;
  catcher.receiveShadow = true;
  scene.add(catcher);
}

/* ===========================================================================
   2. الخامات — الجلد المحبب اتعمل بخريطة نتوءات مولّدة بالكود، مش ملف صورة.
   السبب: صفر تحميل، صفر اعتماد على سيرفر، وتتظبط بالأرقام.
   =========================================================================== */

/** جلد Togo: آلاف الحبيبات العشوائية، مرسومة بحيث تتكرر من غير خط فاصل */
function grainTexture(size = 1024, count = 1500) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080'; ctx.fillRect(0,0,size,size);

  const blob = (x, y, r) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const top = 150 + Math.random()*70;
    g.addColorStop(0,   `rgba(${top},${top},${top},.85)`);
    g.addColorStop(.62, `rgba(128,128,128,.30)`);
    g.addColorStop(1,   `rgba(46,46,46,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  };

  for (let i=0;i<count;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const r = 13 + Math.random()*17;
    blob(x,y,r);
    /* لف الحبيبات اللي على الحدود للناحية التانية — كده الخريطة تتكرر بلا درزة */
    if (x < r) blob(x+size, y, r);
    if (x > size-r) blob(x-size, y, r);
    if (y < r) blob(x, y+size, r);
    if (y > size-r) blob(x, y-size, r);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  /* الـ UV هنا بالسنتيمتر (ExtrudeGeometry بيولّدها بمقياس العالم)، فـ 0.16
     معناها بلاطة ٦ سم — وده اللي بيدّي حبيبة في حجم حبيبة الجلد الحقيقية. */
  tex.repeat.set(0.16, 0.16);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const GRAIN = grainTexture();

/* الألوان المعروضة في اللوحة */
const LEATHER_COLORS = [
  { id:'charcoal', name:'رمادي فحمي', hex:'#333941' },   // لون الشنطة الأصلي
  { id:'black',    name:'أسود',       hex:'#15171a' },
  { id:'sand',     name:'بيج',        hex:'#c3a882' },
  { id:'cognac',   name:'بني',        hex:'#6d4830' },
  { id:'wine',     name:'نبيتي',      hex:'#6b2130' },
  { id:'navy',     name:'كحلي',       hex:'#22314e' },
  { id:'olive',    name:'زيتي',       hex:'#49523f' },
  { id:'cream',    name:'أوف وايت',   hex:'#ddd8ce' },
  { id:'blush',    name:'وردي',       hex:'#cf9ba0' },
  { id:'red',      name:'أحمر',       hex:'#9d2029' },
  { id:'sky',      name:'سماوي',      hex:'#7d9fbd' },
  { id:'forest',   name:'أخضر غامق',  hex:'#20443a' },
];
const METAL_COLORS = [
  { id:'gold',   name:'ذهبي',    hex:'#d4a24c' },        // أكسسوار الشنطة الأصلي
  { id:'silver', name:'فضي',     hex:'#cbd0d6' },
  { id:'rose',   name:'روز جولد', hex:'#d69c86' },
  { id:'gun',    name:'أسود',    hex:'#33363a' },
  { id:'brass',  name:'نحاسي',   hex:'#b98a3f' },
  { id:'steel',  name:'ستيل',    hex:'#9aa1a8' },
];

/* الخامات: كل واحدة مجموعة أرقام فيزيائية بتغيّر إحساس السطح */
const LEATHER_FINISH = {
  grained: { name:'جلد محبب', roughness:.62, clearcoat:.26, clearcoatRoughness:.45, bump:.90, sheen:0,  price:0   },
  smooth:  { name:'جلد ناعم', roughness:.45, clearcoat:.45, clearcoatRoughness:.22, bump:.14, sheen:0,  price:180 },
  suede:   { name:'سويد',     roughness:.96, clearcoat:0,   clearcoatRoughness:1,   bump:.55, sheen:.9, price:120 },
  patent:  { name:'ورنيش',    roughness:.09, clearcoat:1,   clearcoatRoughness:.04, bump:.03, sheen:0,  price:260 },
  canvas:  { name:'قماش',     roughness:.88, clearcoat:.05, clearcoatRoughness:.8,  bump:1.2, sheen:.35,price:-90 },
};
const METAL_FINISH = {
  polished: { name:'مصقول', roughness:.13, price:0   },
  brushed:  { name:'مفروك', roughness:.38, price:60  },
  matte:    { name:'مطفي',  roughness:.58, price:60  },
};

function makeLeather(hex){
  return new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(hex),
    roughness: LEATHER_FINISH.grained.roughness,
    metalness: 0,
    clearcoat: LEATHER_FINISH.grained.clearcoat,
    clearcoatRoughness: LEATHER_FINISH.grained.clearcoatRoughness,
    bumpMap: GRAIN,
    bumpScale: LEATHER_FINISH.grained.bump,
    sheenColor: new THREE.Color(hex).lerp(new THREE.Color('#ffffff'), .5),
    sheenRoughness: .8,
    sheen: 0,
  });
}
function makeMetal(hex){
  return new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(hex),
    metalness: 1, roughness: METAL_FINISH.polished.roughness,
    envMapIntensity: 1.5,
  });
}

/* ===========================================================================
   3. أدوات هندسية — الشنطة كلها مبنية من مضلّعات مدوّرة الأركان ثم مبثوقة.
   =========================================================================== */

/** مضلّع بأركان مدوّرة. r ممكن يكون رقم واحد أو رقم لكل ركن. */
function roundedShape(pts, r){
  const n = pts.length, shape = new THREE.Shape();
  const rad = i => Array.isArray(r) ? r[i] : r;
  for (let i=0;i<n;i++){
    const cur  = pts[i];
    const prev = pts[(i-1+n)%n];
    const next = pts[(i+1)%n];
    const v1 = new THREE.Vector2().subVectors(prev, cur);
    const v2 = new THREE.Vector2().subVectors(next, cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(rad(i), l1*0.48, l2*0.48);
    const p1 = cur.clone().addScaledVector(v1, rr/l1);
    const p2 = cur.clone().addScaledVector(v2, rr/l2);
    if (i === 0) shape.moveTo(p1.x, p1.y); else shape.lineTo(p1.x, p1.y);
    if (rr > 1e-4) shape.quadraticCurveTo(cur.x, cur.y, p2.x, p2.y);
    else shape.lineTo(p2.x, p2.y);
  }
  shape.closePath();
  return shape;
}
const V2 = (x,y) => new THREE.Vector2(x,y);

/** بثق مركزي: الشكل بيتمد على محور Z ويترجع متمركز حوالين الصفر. */
function extrudeCentered(shape, depth, bevel = 0.18, curveSeg = 22){
  const bt = Math.min(bevel, depth/2 - .001);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth - bt*2,
    bevelEnabled: bt > 0.001,
    bevelThickness: bt, bevelSize: bt, bevelSegments: bt > .3 ? 5 : 3,
    curveSegments: curveSeg,
  });
  geo.translate(0, 0, -(depth/2 - bt));
  geo.computeVertexNormals();
  return geo;
}

/**
 * الطية: بيلوي كل نقطة فوق foldY للخلف حوالين محور أفقي.
 * ده اللي بيخلي الفلاب قطعة واحدة متصلة — بينزل على الوش، يلف فوق، ويكمل لورا.
 * من غيره الفلاب بيبقى تلات قطع ملزوقة وباين إنها ملزوقة.
 */
function foldOver(geo, foldY, radius){
  const pos = geo.attributes.position;
  const quarter = radius * Math.PI / 2;
  for (let i = 0; i < pos.count; i++){
    const y = pos.getY(i);
    if (y <= foldY) continue;
    const z = pos.getZ(i);
    const s = y - foldY;                        // المسافة على سطح الجلد
    if (s <= quarter){
      const a = s / radius;                     // زاوية اللف
      pos.setY(i, foldY + radius * Math.sin(a) - z * Math.sin(a));
      pos.setZ(i, z * Math.cos(a) - radius * (1 - Math.cos(a)));
    } else {
      const extra = s - quarter;                // بعد ربع الدورة بيكمل أفقي
      pos.setY(i, foldY + radius - z);
      pos.setZ(i, -radius - extra);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/**
 * إزاحة مضلّع لجوّه بمقدار d — مسار الخياطة.
 * بنحسب المساحة المُوجَّهة الأول عشان نعرف اتجاه اللف، وبالتالي أنهي ناحية
 * هي "جوّه". من غير الحسبة دي الخياطة بتطلع برّه الشنطة.
 */
function insetPolygon(pts, d){
  const n = pts.length, out = [];
  let area = 0;
  for (let i=0;i<n;i++){
    const a = pts[i], b = pts[(i+1)%n];
    area += a.x*b.y - b.x*a.y;
  }
  const w = area > 0 ? 1 : -1;                  // موجب = عكس عقارب الساعة
  for (let i=0;i<n;i++){
    const cur = pts[i], prev = pts[(i-1+n)%n], next = pts[(i+1)%n];
    const e1 = new THREE.Vector2().subVectors(cur, prev).normalize();
    const e2 = new THREE.Vector2().subVectors(next, cur).normalize();
    const n1 = V2(-e1.y*w, e1.x*w);             // العمودي الداخلي
    const n2 = V2(-e2.y*w, e2.x*w);
    const bis = n1.clone().add(n2);
    if (bis.lengthSq() < 1e-8){ out.push(cur.clone().addScaledVector(n1, d)); continue; }
    bis.normalize();
    const sin = Math.max(0.4, bis.dot(n1));     // بيمنع الأركان الحادة من الانفجار
    out.push(cur.clone().addScaledVector(bis, d / sin));
  }
  return out;
}

/**
 * تقويس أفقي: بيرجّع أطراف القطعة لورا بحيث تلف حوالين جنب الشنطة المدوّر.
 * من غيره الفلاب بيبقى لوح مسطّح طايح على وش مقوّس، وبيبان غلط فوراً.
 */
function barrel(geo, halfWidth, amount){
  const pos = geo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const t = Math.min(1, Math.abs(pos.getX(i)) / halfWidth);
    pos.setZ(i, pos.getZ(i) - amount * t * t);
  }
  pos.needsUpdate = true;
  return geo;
}

/** خياطة حقيقية: غُرز صغيرة مجسّمة موزّعة على مسار، بتاخد نور وظل. */
function stitchLine(points2D, z, opts = {}){
  const { spacing = 0.62, len = 0.36, rad = 0.062, closed = true } = opts;
  const zAt = typeof z === 'function' ? z : () => z;
  const pts3 = points2D.map(p => new THREE.Vector3(p.x, p.y, zAt(p)));
  const curve = new THREE.CatmullRomCurve3(pts3, closed, 'catmullrom', 0.02);
  const total = curve.getLength();
  const n = Math.max(4, Math.floor(total / spacing));
  const geo = new THREE.CapsuleGeometry(rad, len, 3, 8);
  const mesh = new THREE.InstancedMesh(geo, STITCH_MAT, n);
  const dummy = new THREE.Object3D();
  const up = new THREE.Vector3(0,1,0);
  for (let i=0;i<n;i++){
    const t = i / n;
    curve.getPointAt(t, dummy.position);
    const tan = curve.getTangentAt(t);
    dummy.quaternion.setFromUnitVectors(up, tan);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = true;
  return mesh;
}

/* ---- 4.2 الفلاب: الحرف المسنّن المميّز، وقطعة واحدة بتلف فوق ---- */
const flapGroup = definePart('flap','الغطاء','leather',leatherFlap, new THREE.Vector3(0, 8.5, 4));
const FLAP_PTS = (() => {
  const yTop  = B.d + FOLD_R * 0.9;                 // امتداد بيلف على ضهر الشنطة
  const hwTop = B.wTop/2 + FLAP_OVER;
  const hwOut = halfAt(B.h - 5.1) + FLAP_OVER;      // نص العرض عند حرف اللسان الجانبي
  const hwIn  = 7.55;                               // مكان الخطوة (السنّة)
  const yOut  = -5.1, yIn = -FLAP_DROP;
  return [
    V2(-hwTop, yTop), V2(hwTop, yTop),              // فوق (اللي هيتلوى لورا)
    V2( hwOut, yOut),                               // نازل على الوش من اليمين
    V2( hwIn,  yOut), V2( hwIn,  yIn),              // السنّة اليمين
    V2(-hwIn,  yIn),  V2(-hwIn,  yOut),             // الحرف السفلي ثم سنّة الشمال
    V2(-hwOut, yOut),
  ];
})();
const FLAP_HW = halfAt(B.h) + FLAP_OVER;
const FLAP_BARREL = 0.72;
{
  const shape = roundedShape(FLAP_PTS, [.5,.5, .55, .30,.42, .42,.30, .55]);
  const geo = extrudeCentered(shape, 0.62, 0.17, 24);

  foldOver(geo, 0, FOLD_R);            // ثم يطوي فوق — بالترتيب ده بيفضل قطعة واحدة
  geo.computeVertexNormals();
  geo.translate(0, B.h - 0.02, B.d/2 + 0.33);
  add(flapGroup, geo, leatherFlap);
}

/* ---- 4.3 حرف المظروف: الحرف على شكل V تحت الفلاب ---- */
const trimGroup = definePart('trim','حرف المظروف','leather',leatherTrim, new THREE.Vector3(-13,-5,6));
/* الـ V: رأسه في النص، وذراعيه بيطلعوا لفوق بميل ثابت لحد ما يختفوا تحت الفلاب */
const V_APEX = 4.62, V_SLOPE = 0.50, V_REACH = 5.0;
const vArmY = x => V_APEX + Math.abs(x) * V_SLOPE;
{
  const zF = B.d/2 + 0.03;
  const path = [];
  for (let i = -1; i <= 1; i += 0.1){
    const x = i * V_REACH;
    path.push(new THREE.Vector3(x, vArmY(x), zF - 0.30 * (Math.abs(i) ** 2)));
  }
  const curve = new THREE.CatmullRomCurve3(path, false, 'catmullrom', 0.05);
  add(trimGroup, new THREE.TubeGeometry(curve, 80, 0.19, 10, false), leatherTrim);
}

/* ---- 4.4 بليتات الـ V الذهب: علامة الشنطة المميزة ---- */
const platesGroup = definePart('plates','بليتات الـ V','metal',metalMain, new THREE.Vector3(13,-5.5,6));
{
  const REACH = 3.15, GAP = 0.42;                      // طول الذراع أفقياً + فتحة النص
  const ang = Math.atan(V_SLOPE);                      // نفس ميل الـ V بالظبط
  const L = REACH / Math.cos(ang);                     // طول البليتة على الذراع
  const hh = 0.62, TH = 0.27;

  const outline = [ V2(-L/2,0), V2(-L/2+.66, hh), V2(L/2-.44, hh), V2(L/2,0), V2(L/2-.44,-hh), V2(-L/2+.66,-hh) ];
  const shape = roundedShape(outline, .20);
  const hole = roundedShape([V2(-.85,-.27), V2(.85,-.27), V2(.85,.27), V2(-.85,.27)], .22);
  shape.holes.push(new THREE.Path(hole.getPoints(24).reverse()));
  const plateGeo = extrudeCentered(shape, TH, .08, 16);

  const screwGeo = new THREE.CylinderGeometry(.115,.115,TH+.10,12);
  screwGeo.rotateX(Math.PI/2);

  for (const side of [-1, 1]){
    const g = new THREE.Group();
    add(g, plateGeo, metalMain);
    for (const t of [-1, 1]){
      const sc = new THREE.Mesh(screwGeo, metalMain);
      sc.position.set(t * (L/2 - 0.36), 0, 0);
      sc.castShadow = true; g.add(sc);
    }
    g.rotation.z = side * ang;                         // موازية لذراع الـ V
    const midX = side * (REACH / 2 + GAP);
    g.position.set(midX, vArmY(midX) + 0.06, B.d/2 + 0.26);
    platesGroup.add(g);
  }
}

/* ---- 4.5 القفل الدوّار على الفلاب ---- */
const lockGroup = definePart('lock','القفل','metal',metalLock, new THREE.Vector3(13, 9.5, 6));
{
  const LY = B.h - 3.30, LZ = B.d/2 + 0.75;   // الوش الخلفي بيلمس الفلاب بالظبط

/* ---- 4.6 اليد: أنبوب على منحنى، مبطّط عشان يبان جلد مش ماسورة ---- */
const handleGroup = definePart('handle','اليد','leather',leatherHndl, new THREE.Vector3(0, 15, 0));

const linksGroup = definePart('links','حلقات اليد','metal',metalLinks, new THREE.Vector3(-13, 9.5, 4));
{

/* ---- 4.8 الخياطة: على حرف الجسم وحرف الفلاب ---- */
const stitchGroup = definePart('stitch','الخياطة','stitch',STITCH_MAT, new THREE.Vector3(0,-12, 4));
{
  /* حرف الجسم — الدرزة اللي بتمسك الجنب بالوش.
     الإزاحة لازم تعدّي الشطف، وإلا الغرز تقع على الحرف المدوّر وتغرق فيه. */
  stitchGroup.add(stitchLine(
    insetPolygon(BODY_PTS, B.bevel + 0.26),
    B.d/2 + 0.04,
    { spacing:.54, len:.20, rad:.034 }
  ));

  /* حرف الفلاب. حاجتين مهمين هنا:
     - مسار مفتوح: الحرف اللي فوق طيّة مش درزة، فلو قفلنا المسار بيتزرع
       خط مستعرض على وش الفلاب مش موجود في الشنطة الحقيقية.
     - الـ z بيتحسب لكل غرزة على حدة عشان تمشي على التقويس مش تخترقه. */
  const bottom = FLAP_PTS.filter(p => p.y <= 0.01);        // من اليمين للشمال
  const closed = [ V2(-FLAP_HW, 0.35), V2(FLAP_HW, 0.35), ...bottom ];
  const inset  = insetPolygon(closed, 0.34).slice(2);      // من غير الحرف العلوي
  const zFlapFace = B.d/2 + 0.33 + 0.31;
  stitchGroup.add(stitchLine(
    inset.map(p => V2(p.x, p.y + B.h - 0.02)),
    p => zFlapFace + 0.04 - FLAP_BARREL * Math.min(1, Math.abs(p.x)/FLAP_HW) ** 2,
    { spacing:.50, len:.19, rad:.032, closed:false }
  ));
}

const LEATHER_PARTS = ['body','flap','handle','trim'];
const METAL_PARTS   = ['plates','lock','links'];

const state = {
  color:  { body:'charcoal', flap:'charcoal', handle:'charcoal', trim:'charcoal',
            plates:'gold', lock:'gold', links:'gold', stitch:'charcoal' },
  finish: { body:'grained', flap:'grained', handle:'grained', trim:'grained',
            plates:'polished', lock:'polished', links:'polished', stitch:'grained' },
  selected: 'body',
};

const MAT_OF = { body:leatherBody, flap:leatherFlap, handle:leatherHndl, trim:leatherTrim,
                 plates:metalMain, lock:metalLock, links:metalLinks, stitch:STITCH_MAT };

function applyPart(id){
  const mat = MAT_OF[id];
  const isMetal = METAL_PARTS.includes(id);
  const list = isMetal ? METAL_COLORS : LEATHER_COLORS;
  const col = list.find(c => c.id === state.color[id]) || list[0];
  mat.color.set(col.hex);

  if (id === 'stitch'){
    /* خياطة نغمية: نفس لون الجلد بس أفتح، عشان تبان بالظل مش بالتباين */
    mat.color.lerp(new THREE.Color('#ffffff'), 0.16);
  } else if (isMetal){
    const f = METAL_FINISH[state.finish[id]] || METAL_FINISH.polished;
    mat.roughness = f.roughness;
  } else {
    const f = LEATHER_FINISH[state.finish[id]] || LEATHER_FINISH.grained;
    mat.roughness = f.roughness;
    mat.clearcoat = f.clearcoat;
    mat.clearcoatRoughness = f.clearcoatRoughness;
    mat.bumpScale = f.bump;
    mat.sheen = f.sheen;
    mat.sheenColor.set(col.hex).lerp(new THREE.Color('#ffffff'), .5);
  }
  mat.needsUpdate = true;
}
function applyAll(){ Object.keys(MAT_OF).forEach(applyPart); updatePrice(); }

/* --- السعر: بيتحرك مع كل اختيار، عشان الاختيارات تبقى ليها وزن --- */
function updatePrice(){
  let p = 2400;
  for (const id of LEATHER_PARTS) p += (LEATHER_FINISH[state.finish[id]]?.price ?? 0);
  for (const id of METAL_PARTS)   p += (METAL_FINISH[state.finish[id]]?.price ?? 0);
  if (state.color.plates === 'rose' || state.color.plates === 'brass') p += 150;
  document.getElementById('price').textContent = p.toLocaleString('ar-EG') + ' ج.م';
}

PART_ORDER.forEach(id => {
  const b = document.createElement('button');

  b.setAttribute('aria-pressed', id === state.selected);
  b.onclick = () => { state.selected = id; renderPanel(); };
  partsEl.appendChild(b);
});

function renderPanel(){
  [...partsEl.children].forEach((b,i) =>
    b.setAttribute('aria-pressed', PART_ORDER[i] === state.selected));

  const id = state.selected;
  const isMetal = METAL_PARTS.includes(id);
  const isStitch = id === 'stitch';
  const list = isMetal ? METAL_COLORS : LEATHER_COLORS;

  colorsEl.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = c.hex; b.title = c.name;
    b.setAttribute('aria-pressed', state.color[id] === c.id);
    b.onclick = () => { state.color[id] = c.id; applyPart(id); updatePrice(); renderPanel(); };
    colorsEl.appendChild(b);
  });

  finishEl.innerHTML = '';
  if (isStitch){
    finishEl.innerHTML = '<span style="font-size:12px;color:var(--ink-dim)">الخياطة لونها بس</span>';
  } else {
    const fl = isMetal ? METAL_FINISH : LEATHER_FINISH;
    Object.entries(fl).forEach(([k,f]) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = f.name;
      b.setAttribute('aria-pressed', state.finish[id] === k);
      b.onclick = () => { state.finish[id] = k; applyPart(id); updatePrice(); renderPanel(); };
      finishEl.appendChild(b);
    });
  }
}

  const d = document.createElement('div');
  d.className = 'lab'; d.textContent = PARTS[id].name;
  labelsEl.appendChild(d);
  labels[id] = d;
});

/* مركز كل قطعة في وضع الراحة — بيتحسب مرة واحدة عند التشغيل.
   حساب Box3 لتمن قطع في كل فريم شغل ضايع، والنتيجة بترجرج كمان. */
const PART_CENTER = {};
PART_ORDER.forEach(id => {
  const box = new THREE.Box3().setFromObject(PARTS[id].group);
  PART_CENTER[id] = box.isEmpty() ? null : box.getCenter(new THREE.Vector3());
});

let explodeTarget = 0, explodeNow = 0, lastGrow = 1;
const clock = new THREE.Clock();
const explodeEl = $('#explode');
explodeEl.oninput = () => {
  explodeTarget = explodeEl.value / 100;
  $('#explodeVal').textContent = explodeEl.value + '%';
};

const _v = new THREE.Vector3(), _dir = new THREE.Vector3();
function updateExplode(dt){
  /* التنعيم بالوقت مش بالفريم: على جهاز بيرسم ٢٠ فريم في الثانية الحركة
     بتاخد نفس المدة زي جهاز بيرسم ١٢٠ — وإلا التفكيك بيزحف على الأجهزة البطيئة. */
  explodeNow = THREE.MathUtils.damp(explodeNow, explodeTarget, 6, dt);
  if (Math.abs(explodeTarget - explodeNow) < 0.002) explodeNow = explodeTarget;
  const e = explodeNow < 0.001 ? 0 : explodeNow;
  const ease = e * e * (3 - 2 * e);      // smoothstep — بداية ونهاية ناعمة

  /* الكاميرا بترجع لورا وهي بتتفكك، وإلا القطع تخرج برّه الشاشة.
     التغيير نسبي عشان تقريب المستخدم اليدوي ما يضيعش. */
  const grow = 1 + 0.75 * ease;
  if (Math.abs(grow - lastGrow) > 1e-5){
    _dir.subVectors(camera.position, controls.target).multiplyScalar(grow / lastGrow);
    camera.position.copy(controls.target).add(_dir);
    lastGrow = grow;
  }

  for (const id of PART_ORDER){
    const p = PARTS[id];
    p.group.position.copy(p.explode).multiplyScalar(ease);

    const lab = labels[id];
    const c = PART_CENTER[id];
    if (ease < 0.12 || !c){ lab.classList.remove('show'); continue; }
    lab.classList.add('show');

    _v.copy(c).add(p.group.position).project(camera);
    if (_v.z > 1){ lab.classList.remove('show'); continue; }
    lab.style.left = ((_v.x * .5 + .5) * innerWidth) + 'px';
    lab.style.top  = ((-_v.y * .5 + .5) * innerHeight) + 'px';
  }
}

/* ===========================================================================
   7. أزرار، حفظ الحالة في اللينك، والحلقة
   =========================================================================== */
const spinBtn = $('#spin');
spinBtn.classList.add('on');
spinBtn.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.classList.toggle('on', controls.autoRotate);
  spinBtn.textContent = controls.autoRotate ? 'إيقاف اللف' : 'تشغيل اللف';
};

$('#shot').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'my-bag.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

/* التصميم كله متشفّر في الـ hash — تبعتي اللينك لحد يفتحه يلاقي نفس الشنطة */
function saveHash(){
  const s = PART_ORDER.map(id => `${state.color[id]||''}.${state.finish[id]||''}`).join('~');
  history.replaceState(null, '', '#' + encodeURIComponent(s));
}
function loadHash(){
  if (!location.hash) return;
  try{
    const parts = decodeURIComponent(location.hash.slice(1)).split('~');
    PART_ORDER.forEach((id,i) => {
      const [c,f] = (parts[i]||'').split('.');
      if (c) state.color[id] = c;
      if (f) state.finish[id] = f;
    });
  }catch(e){ /* لينك مكسور — نكمل بالافتراضي */ }
}

/* اللوحة بتغطي شمال الشاشة (inline-end في RTL)، فلو سبنا الشنطة في نص
   الكانفس هتبان مزحلقة. بنزحلق مخروط الرؤية نفسه — كده الشنطة تتمركز في
   المساحة الفاضية من غير ما نلف الكاميرا أو نحرّك الهدف. */
function frameToFreeArea(){
  camera.aspect = innerWidth / innerHeight;
  const panel = innerWidth > 720 ? Math.min(340, innerWidth * 0.86) : 0;
  if (panel) camera.setViewOffset(innerWidth, innerHeight, -panel/2, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => {
  frameToFreeArea();
  renderer.setSize(innerWidth, innerHeight);
});

let idle = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1);   // سقف بيمنع القفزة بعد ما التاب يرجع
  controls.update(dt);
  updateExplode(dt);
  renderer.render(scene, camera);
  if (++idle === 90) saveHash();
  if (idle > 90) idle = 0;
}

frameToFreeArea();
loadHash();
applyAll();
renderPanel();
tick();

/* أول فريم اتعمل — نشيل شاشة التحميل */
requestAnimationFrame(() => {
  boot.classList.add('gone');
  $('#ui').hidden = false;
  setTimeout(() => boot.remove(), 700);
});

/* لو حصل أي كسر، المستخدم يشوف السبب مش شاشة سودا */
addEventListener('error', e => {
  if (!document.body.contains(boot)) return;
  boot.innerHTML = `<p class="err">الصفحة مقدرتش تشغّل الشنطة.<br>${e.message||''}<br>
    جرّبي متصفح حديث، وتأكدي إن الاتصال شغال — المكتبة بتتحمّل من الإنترنت أول مرة بس.</p>`;
});
</script>
</body>
