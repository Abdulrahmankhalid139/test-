<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرتّب المساحة</title>
<meta name="description" content="صوّر مكتبك أو شنطتك، والتطبيق يقيسها بالسنتيمتر ويقولك ترتّبها إزاي بالظبط. مجاني وبيشتغل من متصفحك.">
<meta name="theme-color" content="#0f7b6c">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مرتّب المساحة">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--paper:#f6f5f2;
--card:#ffffff;
--line:#e4e1db;
--line-soft:#efedE8;
--ink:#14181d;
--dim:#6b7280;
--faint:#9aa1ab;
--accent:#0d6e63;
--accent-ink:#ffffff;
--accent-soft:#e6f1ef;
--accent-line:#b9d8d2;
--mark:#c2571a;
--mark-soft:#fbeee3;
--ok:#15803d;
--ok-soft:#e4f4e9;
--reach:#b9c2cc;
--r-sm:8px; --r:12px; --r-lg:18px;
--shadow:0 1px 2px rgba(20,24,29,.05);
--shadow-lift:0 2px 4px rgba(20,24,29,.06),0 12px 28px rgba(20,24,29,.07);
--sans:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--paper:#131619; --card:#1b1f24; --line:#2b3138; --line-soft:#232830;
--ink:#e8ebee; --dim:#98a1ac; --faint:#6c7681;
--accent:#2fbfae; --accent-ink:#08120f; --accent-soft:#123430; --accent-line:#1e4d46;
--mark:#e8853f; --mark-soft:#33220f;
--ok:#4ade80; --ok-soft:#122b1b;
--reach:#3a434d;
--shadow:0 1px 2px rgba(0,0,0,.4);
--shadow-lift:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.35);
}
}
:root[data-theme="dark"]{
--paper:#131619; --card:#1b1f24; --line:#2b3138; --line-soft:#232830;
--ink:#e8ebee; --dim:#98a1ac; --faint:#6c7681;
--accent:#2fbfae; --accent-ink:#08120f; --accent-soft:#123430; --accent-line:#1e4d46;
--mark:#e8853f; --mark-soft:#33220f;
--ok:#4ade80; --ok-soft:#122b1b;
--reach:#3a434d;
--shadow:0 1px 2px rgba(0,0,0,.4);
--shadow-lift:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{direction:rtl}
body{
margin:0;background:var(--paper);color:var(--ink);
font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%;
-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
svg{flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.topbar{
position:sticky;top:0;z-index:30;background:var(--card);
border-bottom:1px solid var(--line);
padding:0 14px;padding-top:env(safe-area-inset-top);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;height:52px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{color:var(--accent)}
.brand h1{
margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-actions{display:flex;gap:6px;flex:none}
.icon-btn{
display:inline-flex;align-items:center;justify-content:center;gap:4px;
height:32px;min-width:32px;padding:0 8px;border-radius:var(--r-sm);
border:1px solid var(--line);background:var(--paper);color:var(--dim);
font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{
display:grid;grid-template-columns:1fr 1fr;gap:3px;
padding:3px;margin-bottom:10px;
background:var(--paper);border:1px solid var(--line);border-radius:11px;
}
.tab{
display:flex;align-items:center;justify-content:center;gap:7px;
padding:9px 6px;border:0;border-radius:8px;background:none;cursor:pointer;
font:inherit;font-size:13.5px;font-weight:700;color:var(--dim);transition:.16s;
}
.tab svg{opacity:.75}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.tab.active svg{opacity:1}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{max-width:680px;margin:0 auto;padding:18px 16px 150px}
.screen{display:none}
.screen.active{display:block;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none}}
h2{font-size:19px;margin:0 0 4px;font-weight:800;letter-spacing:-.3px;text-wrap:balance}
h3{font-size:14px;margin:22px 0 8px;font-weight:800;letter-spacing:.02em}
.lead{color:var(--dim);margin:0 0 22px;font-size:14.5px;max-width:56ch}
.hint{font-size:12.5px;color:var(--dim);margin:6px 0;line-height:1.55}
.hint.center{text-align:center}
.muted{color:var(--dim)}
.hidden{display:none !important}
a{color:var(--accent)}
.field{position:relative;padding-inline-start:30px;padding-bottom:22px}
.field::before{
content:'';position:absolute;inset-inline-start:11px;top:26px;bottom:0;
width:1px;background:var(--line);
}
.field:last-of-type::before{display:none}
.label{
display:flex;align-items:center;gap:8px;
font-weight:800;font-size:14.5px;margin-bottom:8px;letter-spacing:-.2px;
}
.stepno{
position:absolute;inset-inline-start:0;
display:inline-flex;align-items:center;justify-content:center;
width:23px;height:23px;border-radius:50%;
background:var(--accent);color:var(--accent-ink);
font-family:var(--mono);font-size:11px;font-weight:700;
}
.input{
width:100%;padding:11px 13px;border-radius:10px;
border:1px solid var(--line);background:var(--card);color:var(--ink);
font:inherit;font-size:14.5px;margin-top:7px;transition:.15s;
}
.input:hover{border-color:var(--accent-line)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.input{appearance:none;background-image:none;padding-inline-end:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:96px}
.btn{
display:flex;align-items:center;justify-content:center;gap:8px;
width:100%;padding:12px 16px;border-radius:11px;
border:1px solid var(--line);background:var(--card);color:var(--ink);
font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
margin-top:9px;transition:.15s;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--dim)}
.btn.big{padding:14px 16px;font-size:15px}
.actionbar{
position:fixed;inset-inline:0;bottom:0;z-index:25;
padding:10px 16px calc(10px + env(safe-area-inset-bottom));
background:color-mix(in srgb,var(--card) 92%,transparent);
backdrop-filter:blur(12px);border-top:1px solid var(--line);
}
.actionbar-inner{max-width:680px;margin:0 auto;display:grid;gap:7px}
.actionbar .btn{margin-top:0}
.preview{margin-top:10px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.items{display:grid;gap:8px;margin:14px 0}
.item{
display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;
padding:12px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);
}
.item-name{
font:inherit;font-size:14.5px;font-weight:700;width:100%;padding:1px 0;
border:0;background:none;color:var(--ink);
}
.item-name:focus{outline:none;box-shadow:0 1px 0 var(--accent)}
.item-dims{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.item-dims label{
font-size:10.5px;color:var(--faint);display:flex;flex-direction:column;
gap:3px;align-items:center;font-weight:700;letter-spacing:.03em;
}
.item-dims input{
width:58px;padding:6px 4px;border:1px solid var(--line);border-radius:7px;
background:var(--paper);color:var(--ink);
font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:center;
}
.item-dims input:focus{outline:none;border-color:var(--accent);background:var(--card)}
.item select{
padding:6px 9px;border:1px solid var(--line);border-radius:7px;
background:var(--paper);color:var(--dim);font:inherit;font-size:12.5px;
margin-top:8px;margin-inline-end:5px;appearance:none;
}
.item-del{
background:none;border:0;color:var(--faint);font-size:19px;line-height:1;
cursor:pointer;padding:3px 6px;border-radius:6px;
}
.item-del:hover{color:var(--mark);background:var(--mark-soft)}
.conf-low{border-inline-start:3px solid var(--mark)}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.stat{
flex:1;min-width:78px;padding:11px 8px;background:var(--card);
border:1px solid var(--line);border-radius:var(--r);text-align:center;
}
.stat b{
display:block;font-family:var(--mono);font-size:19px;font-weight:700;
font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.stat span{font-size:11px;color:var(--dim);font-weight:600;line-height:1.3;display:block;margin-top:2px}
.plan{
background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:8px;overflow-x:auto;
}
.plan-svg{width:100%;height:auto;display:block}
.layers{display:grid;gap:14px}
.layer{margin:0}
.legend{list-style:none;padding:0;margin:11px 0;display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:var(--dim)}
.legend li{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.banner{padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--mark-soft);color:var(--mark)}
.ai-note{
background:var(--accent-soft);border-radius:var(--r);padding:13px 14px;
margin:14px 0;font-size:13.5px;line-height:1.65;
border-inline-start:3px solid var(--accent);color:var(--ink);
}
.notes{display:grid;gap:7px;margin:14px 0}
.note{padding:10px 12px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.note.warn{background:var(--mark-soft);color:var(--mark)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.tip{background:var(--card);border:1px solid var(--line);color:var(--dim)}
.steps{margin:14px 0}
.steps ol{padding-inline-start:19px;margin:8px 0}
.steps li{margin-bottom:9px;font-size:13.5px}
.steps .pos{color:var(--dim);font-size:12.5px}
.off-desk{background:var(--mark-soft);border-radius:var(--r);padding:13px 14px;margin-top:14px}
.off-desk h3{margin-top:0;color:var(--mark);font-size:13.5px}
.off-desk ul{margin:6px 0 0;padding-inline-start:19px;font-size:12.5px;color:var(--mark)}
.saved{margin-top:26px}
.saved ul{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.saved li{
display:flex;justify-content:space-between;align-items:center;gap:10px;
padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);
background:var(--card);font-size:13.5px;
}
.saved button{background:none;border:0;font:inherit;font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:700;padding:3px 5px}
.detected{
background:var(--accent-soft);border:1px solid var(--accent-line);
border-radius:var(--r);padding:13px 14px;margin-bottom:13px;
}
.detected-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--dim)}
.detected-row b{font-size:16px;color:var(--ink);font-weight:800}
.link-btn{background:none;border:0;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:2px}
.rules{list-style:none;padding:0;margin:11px 0 0;display:flex;flex-wrap:wrap;gap:5px}
.rules li{
font-size:11px;background:var(--card);border:1px solid var(--accent-line);
border-radius:20px;padding:3px 9px;color:var(--dim);
}
#changeSpaceWrap{margin-top:10px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:18px}
.ask .btn{margin-top:8px}
dialog{
border:0;border-radius:var(--r-lg);padding:22px;max-width:420px;width:calc(100% - 32px);
background:var(--card);color:var(--ink);box-shadow:var(--shadow-lift);
}
dialog::backdrop{background:rgba(20,24,29,.55);backdrop-filter:blur(2px)}
dialog h2{margin-top:0}
dialog .row{margin-top:16px}
dialog .btn{margin-top:0}
.toast{
position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:10px;
font-size:13.5px;font-weight:600;z-index:100;max-width:90%;text-align:center;
box-shadow:var(--shadow-lift);
}
.loader{
position:fixed;inset:0;background:rgba(20,24,29,.6);backdrop-filter:blur(3px);
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:14px;z-index:90;color:#fff;font-size:14px;font-weight:600;padding:24px;text-align:center;
}
.spinner{
width:34px;height:34px;border:2.5px solid rgba(255,255,255,.22);
border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:620px){
#app{padding-bottom:130px}
.actionbar-inner{grid-template-columns:1fr 1fr}
.actionbar-inner .btn.primary{grid-column:1/-1}
}
#app{padding:14px 14px 140px}
.lead{margin:0 0 16px;font-size:13.5px}
.field{padding-bottom:16px;padding-inline-start:28px}
.field::before{top:24px}
.label{font-size:13.5px;margin-bottom:5px}
.stepno{width:21px;height:21px;font-size:10.5px}
.hint{font-size:12px;margin:4px 0}
.input{padding:10px 12px;font-size:14px;margin-top:6px}
h2{font-size:17.5px}
h3{font-size:13.5px;margin:18px 0 7px}
.btn{padding:11px 14px;font-size:14px;margin-top:8px}
.btn.big{padding:13px 14px;font-size:14.5px}
.item{padding:10px 11px}
.item-name{font-size:14px}
.stat{padding:9px 6px;min-width:70px}
.stat b{font-size:17px}
.steps li{margin-bottom:7px;font-size:13px}
.note{padding:9px 11px;font-size:12.5px}
.ai-note{padding:12px;font-size:13px}
.detected{padding:11px 12px}
.photo-tile{
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
width:100%;min-height:104px;padding:18px;margin-top:6px;
border:1.5px dashed var(--accent-line);border-radius:var(--r-lg);
background:var(--accent-soft);color:var(--accent);
font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.16s;
}
.photo-tile:hover{border-color:var(--accent);background:var(--card)}
.photo-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.photo-tile svg{opacity:.9}
.photo-tile small{font-size:11.5px;font-weight:600;color:var(--dim)}
@media (max-width:380px){
#app{padding-inline:12px}
.item-dims input{width:52px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 17.5 17.5 3l3.5 3.5L6.5 21z"/>
        <path d="M7 13.5 8.5 15M10 10.5 11.5 12M13 7.5 14.5 9"/>
      </svg>
      <h1 data-i18n="appName">مرتّب المساحة</h1>
    </div>
    <div class="topbar-actions">
      <button id="btnLang" class="icon-btn" type="button">EN</button>
      <button id="btnSettings" class="icon-btn" type="button" aria-label="info">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.1"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="app">


  <section class="screen active" data-screen="capture">
    <p class="lead" data-i18n="lead"></p>

    <div class="field">
      <label class="label"><span class="stepno">1</span> <span data-i18n="step3">الصورة</span></label>
      <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
      <button id="btnPick" class="photo-tile" type="button">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.5h3.2l1.4-2.2h8.8l1.4 2.2H21v10H3z"/><circle cx="12" cy="13" r="3.4"/>
        </svg>
        <span data-i18n="takePhoto"></span>
        <small data-i18n="photoHint"></small>
      </button>
      <div id="preview" class="preview hidden"><img id="previewImg" alt=""></div>
    </div>


    <div class="field">
      <label class="label"><span class="stepno">2</span> <span data-i18n="step1">مرجع القياس</span></label>
      <p class="hint" id="scaleHint"></p>
      <select id="scaleRef" class="input"></select>
      <div id="customRefWrap" class="hidden">
        <input id="customRefCm" class="input" type="number" min="1" step="0.1" data-i18n-ph="customRefCm" placeholder="">
      </div>
    </div>

    <div class="field" id="deskOpts">
      <label class="label"><span class="stepno">3</span> <span data-i18n="spaceTypeQ">المساحة دي إيه؟</span></label>
      <select id="spaceType" class="input"></select>
      <p class="hint" id="spaceTypeHint"></p>
      <input id="intent" class="input" type="text" maxlength="120" data-i18n-ph="intentPlaceholder" placeholder="">
      <p class="hint" data-i18n="intentExample"></p>
      <select id="dominantHand" class="input">
        <option value="right" data-i18n="handRight"></option>
        <option value="left" data-i18n="handLeft"></option>
      </select>
    </div>

    <div class="field hidden" id="bagOpts">
      <label class="label"><span class="stepno">3</span> <span data-i18n="step2Bag">الشنطة</span></label>
      <select id="bagPreset" class="input"></select>
      <div id="customBagWrap" class="row hidden">
        <input id="bagW" class="input" type="number" data-i18n-ph="bagW" placeholder="">
        <input id="bagD" class="input" type="number" data-i18n-ph="bagD" placeholder="">
        <input id="bagH" class="input" type="number" data-i18n-ph="bagH" placeholder="">
      </div>
      <p class="hint" data-i18n="airlineWarn"></p>
    </div>

    <p class="hint center" data-i18n="privacy"></p>

    <div id="savedScans" class="saved hidden">
      <h3 data-i18n="saved">محفوظات</h3>
      <ul id="savedList"></ul>
    </div>
  </section>

  <!-- ═══ ٣) مراجعة الحاجات ═══ -->
  <section class="screen" data-screen="review">
    <button class="back" data-goto="capture" data-i18n="back"></button>
    <h2 data-i18n="reviewTitle"></h2>
    <div id="scaleBanner" class="banner"></div>
    <div id="detectedSpace" class="detected hidden">
      <div class="detected-row">
        <span><span data-i18n="spaceIs"></span> <b id="detectedName">—</b></span>
        <button id="btnChangeSpace" class="link-btn" data-i18n="changeIt"></button>
      </div>
      <div id="changeSpaceWrap" class="hidden">
        <input id="adaptIntent" class="input" type="text" maxlength="120" data-i18n-ph="adaptPlaceholder" placeholder="">

function physicalNotes({ surface, windowSide, dominant, placed, offDesk, cats }) {

} else if (windowSide === 'front' && hasScreen) {
out.push({ level: 'warn', text: { key: 'n_windowFront' } });
} else if (windowSide === 'left' || windowSide === 'right') {
out.push({ level: 'ok', text: { key: 'n_windowSide' } });
}
const lamp = placed.find((p) => /lamp|إضاءة|أباجورة/i.test(p.category + p.nameAr));
if (lamp) {
const onDominant = dominant === 'right'
? lamp.x + lamp.w / 2 > surface.widthCm / 2
: lamp.x + lamp.w / 2 < surface.widthCm / 2;
if (!onDominant) {
out.push({ level: 'ok', text: { key: 'n_lamp', params: { hand: dominant === 'right' ? 'left' : 'right' } } });
}
}
if (placed.some((p) => cats[p.category]?.keepDry)) {
out.push({ level: 'tip', text: { key: 'n_liquids' } });
}
if (placed.some((p) => cats[p.category]?.hot)) {
out.push({ level: 'tip', text: { key: 'n_hot' } });
}
if (offDesk.length) {
out.push({ level: 'tip', text: { key: 'n_removed', params: { n: offDesk.length } } });
}
return out;
}

function fileToBase64Resized(file, maxSide = 1280) {
return new Promise((resolve, reject) => {
const img = new Image();
const url = URL.createObjectURL(file);
img.onload = () => {
URL.revokeObjectURL(url);
const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
const w = Math.round(img.width * scale);
const h = Math.round(img.height * scale);
const canvas = document.createElement('canvas');
canvas.width = w;
canvas.height = h;
canvas.getContext('2d').drawImage(img, 0, 0, w, h);
const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
canvas.toBlob(
(blob) => resolve({ blob, dataUrl, base64: dataUrl.split(',')[1], width: w, height: h }),
'image/jpeg',
0.85,
);
};
img.onerror = () => {
URL.revokeObjectURL(url);
reject(new Error('مقدرناش نفتح الصورة دي'));
};
img.src = url;
});
}

if (!sample) return;
try {
const text = await explainPlan({ mode: isBag() ? 'bag' : 'surface', plan: state.plan, sample, lang: getLang() });
if (text.trim()) {
$('#aiNote').textContent = text.trim();
$('#aiNote').classList.remove('hidden');
}
} catch { /* الشرح رفاهية — المخطط هو الأساس */ }
}
async function onAfterImage() {
const sample = await aiReady();
if (!state.image) return toast(t('t_noOriginal'));
loading(true, t('t_drawing'));
try {
const url = await renderAfterImage({ image: state.image, plan: state.plan, sample });
$('#afterImage').src = url;
$('#afterImageWrap').classList.remove('hidden');
$('#afterImageWrap').scrollIntoView({ behavior: 'smooth' });
} catch (err) {
toast(err.message);
} finally {
loading(false);
}
}
function onSave() {
const ok = store.saveScan({
mode: isBag() ? 'bag' : 'surface',
title: !isBag()
? `${tx(state.profile?.spaceTypeAr) || t('appName')} ${Math.round(state.surface.widthCm)}×${Math.round(state.surface.depthCm)}`
: `${tx(state.profile?.spaceTypeAr) || t('bagResult')}`,
items: state.items,
surface: state.surface,
profile: state.profile,
bin: state.bin,
});
toast(ok ? t('t_savedOk') : t('t_savedFull'));
renderSaved();
}
function renderSaved() {
const scans = store.getScans();
$('#savedScans').classList.toggle('hidden', !scans.length);
$('#savedList').innerHTML = scans.map((s) => `
<li>
<span>${escHtml(s.title)} <span class="muted">— ${new Date(s.savedAt).toLocaleDateString(getLang() === 'ar' ? 'ar-EG' : 'en-GB')}</span></span>
<span>
<button data-load="${s.savedAt}">${escHtml(t('open'))}</button>
<button data-drop="${s.savedAt}">${escHtml(t('erase'))}</button>
</span>
</li>`).join('');
$('#savedList').onclick = (e) => {
const load = e.target.dataset.load, drop = e.target.dataset.drop;
if (drop) { store.deleteScan(+drop); renderSaved(); return; }
if (!load) return;
const s = store.getScans().find((x) => x.savedAt === +load);
if (!s) return;
state.items = s.items; state.surface = s.surface || state.surface; state.profile = s.profile; state.bin = s.bin;
renderDetectedSpace();
renderItems();
showScreen('review');
};
}
function applyProfileSize() {
const size = state.profile?.defaultSizeCm;
if (size?.width > 0 && size?.depth > 0) {
state.surface = { widthCm: size.width, depthCm: size.depth, heightCm: size.height || 30 };
if (isBag()) {
$('#bagW').value = size.width; $('#bagD').value = size.depth; $('#bagH').value = size.height || 30;
}
}
}
function renderDetectedSpace() {
const box = $('#detectedSpace');
if (!state.profile) { box.classList.add('hidden'); return; }
box.classList.remove('hidden');
const src = state.profile.source === 'ai' ? ' 🤖' : '';
$('#detectedName').textContent = tx(state.profile.spaceTypeAr) + src;
$('#rulesList').innerHTML = Object.values(state.profile.categories)
.filter((c) => c.zone)
.slice(0, 14)
.map((c) => {
const zone = t('zone_' + c.zone);
const flags = [c.keepDry && '💧', c.avoidLight && '🌑', c.wantsLight && '☀️', c.hot && '🔥', c.anchor && '📌']
.filter(Boolean).join('');
return `<li>${escHtml(tx(c.labelAr))} → ${escHtml(zone)} ${flags}</li>`;
}).join('');
}
async function onAdaptProfile() {
const sample = await aiReady();
if (!sample) return toast(t('t_noAI'));
const intent = $('#adaptIntent').value.trim();
if (!intent) return toast(t('t_writeIntent'));
if (!state.profile) return toast(t('t_needSpace'));
loading(true, t('t_rewriting'));
try {
const adapted = await adaptProfile({ profile: state.profile, intent, sample, lang: getLang() });
if (!adapted) throw new Error(t('t_noRules'));
const before = state.profile.spaceTypeAr;
state.profile = normalizeProfile(adapted, state.profile);
if (state.profile.spaceTypeAr !== before) applyProfileSize();
for (const it of state.items) {
if (!state.profile.categories[it.category]) it.category = 'other';
}
renderDetectedSpace();
renderItems();
$('#changeSpaceWrap').classList.add('hidden');
toast(t('t_rulesChanged'));
} catch (err) {
toast(err.message);
} finally {
loading(false);
}
}
async function onAsk() {
const sample = await aiReady();
if (!sample) return toast(t('t_noAI'));
const question = $('#askInput').value.trim();
if (!question) return toast(t('t_writeQuestion'));
if (!state.plan) return toast(t('t_calcFirst'));
loading(true, t('thinking'));
try {
$('#askAnswer').textContent = t('thinking');
$('#askAnswer').classList.remove('hidden');
const answer = await askAboutSpace({
question, plan: state.plan, mode: isBag() ? 'bag' : 'surface', sample, lang: getLang(),
onText: ({ text }) => { $('#askAnswer').textContent = text; },
});
$('#askAnswer').textContent = answer.trim() || t('t_noAnswer');
} catch (err) {
toast(err.message);
} finally {
loading(false);
}
}
init();

</script>
</body>
</html>
