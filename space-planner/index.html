<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرتّب المساحة</title>
<meta name="description" content="صوّر مكتبك أو شنطتك، والتطبيق يقيسها بالسنتيمتر ويقولك ترتّبها إزاي بالظبط. مجاني وبيشتغل من متصفحك.">
<meta name="theme-color" content="#0f7b6c">
<link rel="manifest" href="manifest.json">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مرتّب المساحة">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 17.5 17.5 3l3.5 3.5L6.5 21z"/>
        <path d="M7 13.5 8.5 15M10 10.5 11.5 12M13 7.5 14.5 9"/>
      </svg>
      <h1 data-i18n="appName">مرتّب المساحة</h1>
    </div>
    <div class="topbar-actions">
      <button id="btnLang" class="icon-btn" type="button">EN</button>
      <button id="btnSettings" class="icon-btn" type="button" aria-label="info">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.1"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="app">


  <section class="screen active" data-screen="capture">
    <p class="lead" data-i18n="lead"></p>

    <div class="field">
      <label class="label"><span class="stepno">1</span> <span data-i18n="step3">الصورة</span></label>
      <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
      <button id="btnPick" class="photo-tile" type="button">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.5h3.2l1.4-2.2h8.8l1.4 2.2H21v10H3z"/><circle cx="12" cy="13" r="3.4"/>
        </svg>
        <span data-i18n="takePhoto"></span>
        <small data-i18n="photoHint"></small>
      </button>
      <div id="preview" class="preview hidden"><img id="previewImg" alt=""></div>
    </div>


    <div class="field">
      <label class="label"><span class="stepno">2</span> <span data-i18n="qWhat"></span></label>
      <p class="hint" data-i18n="qWhatHint"></p>
      <input id="whatInput" class="input" type="text" maxlength="160" data-i18n-ph="qWhatPh" placeholder="">
    </div>

    <div class="field">
      <label class="label"><span class="stepno">3</span> <span data-i18n="qPut"></span></label>
      <p class="hint" data-i18n="qPutHint"></p>
      <input id="putInput" class="input" type="text" maxlength="300" data-i18n-ph="qPutPh" placeholder="">
    </div>

    <details class="panel" id="morePanel">
      <summary data-i18n="moreOptions"></summary>
      <label class="label sub" data-i18n="spaceTypeQ"></label>
      <select id="spaceType" class="input"></select>
      <label class="label sub" data-i18n="handQ"></label>
      <select id="dominantHand" class="input">
        <option value="right" data-i18n="handRight"></option>
        <option value="left" data-i18n="handLeft"></option>
      </select>
      <input id="intent" class="input" type="text" maxlength="120" data-i18n-ph="intentPlaceholder" placeholder="">
    </details>

    <p class="hint center" data-i18n="privacy"></p>

    <div id="savedScans" class="saved hidden">
      <h3 data-i18n="saved">محفوظات</h3>
      <ul id="savedList"></ul>
    </div>
  </section>

  <!-- ═══ ٣) مراجعة الحاجات ═══ -->
  <section class="screen" data-screen="review">
    <button class="back" data-goto="capture" data-i18n="back"></button>
    <h2 data-i18n="reviewTitle"></h2>
    <div id="scaleBanner" class="banner"></div>
    <div id="detectedSpace" class="detected hidden">
      <div class="detected-row">
        <span><span data-i18n="spaceIs"></span> <b id="detectedName">—</b></span>
        <button id="btnChangeSpace" class="link-btn" data-i18n="changeIt"></button>
      </div>
      <div id="changeSpaceWrap" class="hidden">
        <input id="adaptIntent" class="input" type="text" maxlength="120" data-i18n-ph="adaptPlaceholder" placeholder="">
        <button id="btnAdapt" class="btn ghost" data-i18n="adaptBtn"></button>
      </div>
      <ul id="rulesList" class="rules"></ul>
      <p id="handNote" class="hint hidden"></p>
    </div>
    <div id="photoRef" class="photo-ref hidden">
      <img id="photoRefImg" alt="">
      <p class="hint" id="photoRefNote"></p>
    </div>
    <p class="hint" data-i18n="reviewHint"></p>
    <div id="itemsList" class="items"></div>
    <button id="btnAddItem" class="btn ghost" data-i18n="addItem"></button>
  </section>

  <!-- ═══ ٤) النتيجة ═══ -->
  <section class="screen" data-screen="result">
    <button class="back" data-goto="review" data-i18n="backToSizes"></button>
    <h2 id="resultTitle"></h2>
    <div id="autoSkipBar" class="banner ok skip-bar hidden">
      <span data-i18n="autoAccepted"></span>
      <button id="btnOpenReview" class="link-btn" type="button" data-i18n="openReview"></button>
      <button id="btnDismissSkip" class="link-btn" type="button" data-i18n="dismissBar"></button>
    </div>
    <div id="statsRow" class="stats"></div>

    <div id="planView" class="plan"></div>

    <div id="photoView" class="photo-plan hidden">
      <img id="photoBase" alt="">
      <div id="photoOverlay"></div>
      <p class="hint" id="photoNote"></p>
    </div>

    <div id="editTools" class="edit-tools hidden">
      <button id="btnMoveMode" class="tool" type="button"><span>✋</span><span data-i18n="moveMode"></span></button>
      <button id="btnRemoveItem" class="tool" type="button" disabled><span>🗑</span><span data-i18n="removeItem"></span></button>
      <button id="btnUndo" class="tool" type="button"><span>↩</span><span data-i18n="undoMove"></span></button>
      <button id="btnResetLayout" class="tool" type="button"><span>⟲</span><span data-i18n="resetLayout"></span></button>
      <button id="btnSaveEdit" class="tool primary" type="button"><span>💾</span><span data-i18n="saveEdit"></span></button>
    </div>
    <div id="editBar" class="editbar hidden">
      <span id="editVerdict" class="verdict"></span>
    </div>
    <div id="removedList" class="removed-list hidden"></div>
    <p class="hint" id="editHint"></p>

    <div id="legendView"></div>
    <div id="aiNote" class="ai-note hidden"></div>
    <div id="notesView" class="notes"></div>
    <div id="stepsView" class="steps"></div>
    <details class="panel" id="fitPanel">
      <summary data-i18n="fitTitle"></summary>
      <p class="hint" data-i18n="fitHint"></p>
      <div class="row">
        <input id="fitName" class="input" type="text" maxlength="40" data-i18n-ph="fitName" placeholder="">
        <button id="btnFitAsk" class="btn ghost small" data-i18n="fitAsk"></button>
      </div>
      <div class="row">
        <input id="fitW" class="input" type="number" min="1" step="0.5" data-i18n-ph="sizeW" placeholder="">
        <input id="fitD" class="input" type="number" min="1" step="0.5" data-i18n-ph="sizeD" placeholder="">
        <input id="fitH" class="input" type="number" min="1" step="0.5" data-i18n-ph="sizeH" placeholder="">
      </div>
      <button id="btnFitCheck" class="btn ghost" data-i18n="fitCheck"></button>
      <div id="fitResult" class="ai-note hidden"></div>
    </details>

    <details class="panel" id="spacesPanel">
      <summary data-i18n="spacesTitle"></summary>
      <p class="hint" data-i18n="spacesHint"></p>
      <div id="spacesList"></div>
      <div class="row">
        <select id="addSpaceType" class="input"></select>
        <button id="btnAddSpace" class="btn ghost small" data-i18n="addSpace"></button>
      </div>
      <div id="spacesResult" class="hidden"></div>
    </details>

    <div class="ask">
      <label class="label" for="askInput" data-i18n="askTitle"></label>
      <input id="askInput" class="input" type="text" maxlength="200" data-i18n-ph="askPlaceholder" placeholder="">
      <button id="btnAsk" class="btn ghost" data-i18n="askBtn"></button>
      <div id="askAnswer" class="ai-note hidden"></div>
    </div>
    <div class="actions">
      <button id="btnRealImage" class="btn primary hidden" data-i18n="realImage"></button>
      <button id="btnSave" class="btn ghost" data-i18n="save"></button>
    </div>
    <p class="hint" id="realImageHint"></p>
    <div id="afterImageWrap" class="hidden">
      <img id="afterImage" alt="">
      <p class="hint" id="afterNote"></p>
    </div>
  </section>

</main>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <button id="btnAnalyze" class="btn primary big" disabled data-i18n="analyze"></button>
    <button id="btnManual" class="btn ghost" data-i18n="manual"></button>
    <button id="btnPlan" class="btn primary big hidden" data-i18n="calc"></button>
  </div>
</div>

<!-- ═══ الإعدادات ═══ -->
<dialog id="settingsDialog">
  <form method="dialog">
    <h2 data-i18n="about"></h2>
    <p class="hint" data-i18n-html="aboutBody"></p>
    <p class="hint" data-i18n="aboutAccuracy"></p>
    <p class="hint" data-i18n="aboutPrivacy"></p>
    <label class="check"><input type="checkbox" id="optAutoSkip" checked> <span data-i18n="optAutoSkip"></span></label>
    <p class="hint" data-i18n="optAutoSkipHint"></p>
    <div id="keyWrap" class="hidden">
      <label class="label" for="apiKey" data-i18n="apiKeyLabel"></label>
      <input id="apiKey" class="input" type="password" autocomplete="off" data-i18n-ph="apiKeyPh" placeholder="">
      <p class="hint" data-i18n-html="apiKeyHint"></p>
    </div>
    <button id="btnInstall" type="button" class="btn ghost hidden" data-i18n="install"></button>
    <div class="row">
      <button value="ok" class="btn primary" data-i18n="ok"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast hidden"></div>
<div id="loader" class="loader hidden"><div class="spinner"></div><p id="loaderText"></p></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
